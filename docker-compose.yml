services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - TERRA_SIGNING_SECRET=${TERRA_SIGNING_SECRET:-}
      - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY:-}

  frontend:
    build:
      context: ./frontend
      args:
        # Must be reachable from the browser (the host), not the Docker network.
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
